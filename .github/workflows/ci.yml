name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests, coverage, dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: System libraries (MediaPipe needs EGL even on CPU)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgles2

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Download pose model (checksum-verified)
        run: python scripts/download_model.py

      - name: Ruff
        run: ruff check .

      - name: Mypy (src/behaviorlens, strict)
        run: mypy

      - name: Pytest with coverage
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Dependency vulnerability scan (pip-audit, pinned set)
        run: pip-audit -r constraints.txt --no-deps --disable-pip --progress-spinner off

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: container build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t behaviorlens:ci .
      - name: Smoke test (loopback publish, health endpoint, non-root)
        run: |
          docker run -d --name bl -p 127.0.0.1:8501:8501 behaviorlens:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          test "$(docker exec bl id -u)" != "0"
          docker exec bl python -c "from behaviorlens.pose import verify_model; assert verify_model()"
          docker logs bl 2>&1 | tee docker.log
          ! grep -qi "Traceback" docker.log
      - name: Stop container
        if: always()
        run: docker rm -f bl || true

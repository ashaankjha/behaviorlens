[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behaviorlens"
version = "0.1.0"
description = "Local computer-vision-assisted review of staged behavioral session videos (research/demo prototype)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["inference: runs real MediaPipe inference (needs the downloaded model)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src/behaviorlens"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Untyped third-party packages (no stubs published).
module = ["mediapipe", "mediapipe.*", "imageio_ffmpeg"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/behaviorlens"]
branch = true

[tool.coverage.report]
# Floor = measured coverage on 2026-10-20, rounded down (docs/regulatory/verification_report.md).
fail_under = 91
show_missing = true
skip_covered = true
